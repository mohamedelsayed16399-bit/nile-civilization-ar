<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حضارة النيل - من قرية إلى إمبراطورية</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1410;color:#f5e6c8;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#top{position:fixed;top:0;left:0;right:0;z-index:5;background:linear-gradient(#3b2a17,#2a1d10);border-bottom:2px solid #c9a24b;padding:4px 6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
#top .r{white-space:nowrap;background:#ffffff10;border-radius:10px;padding:2px 7px}
#top .era{font-weight:bold;color:#ffd36b}
#cv{position:fixed;left:0;right:0;top:0;bottom:0;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#2a1d10;border-top:2px solid #c9a24b}
#tabs{display:flex;overflow-x:auto}
#tabs button{flex:1;min-width:64px;background:#3b2a17;color:#f5e6c8;border:0;border-left:1px solid #1b1410;padding:9px 4px;font-size:14px;font-family:inherit}
#tabs button.on{background:#c9a24b;color:#2a1d10;font-weight:bold}
#panel{max-height:34vh;overflow-y:auto;padding:6px;display:none;touch-action:pan-y}
#panel.open{display:block}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.card{background:#3b2a17;border:1px solid #6b4f2a;border-radius:8px;padding:6px 8px;min-width:130px;flex:1 1 130px;font-size:12px}
.card b{font-size:14px}
.card button{margin-top:4px;background:#c9a24b;color:#2a1d10;border:0;border-radius:6px;padding:6px 10px;font-family:inherit;font-weight:bold;width:100%}
.card button:disabled{opacity:.4}
.card.sel{outline:2px solid #ffd36b}
.small{font-size:11px;opacity:.8}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid #c9a24b;padding:8px 14px;border-radius:10px;z-index:9;display:none;max-width:90%;text-align:center;font-size:14px}
#spd{position:fixed;left:6px;top:58px;z-index:5;display:flex;gap:4px}
#spd button{background:#3b2a17cc;color:#fff;border:1px solid #c9a24b;border-radius:6px;padding:5px 9px;font-size:14px}
#spd button.on{background:#c9a24b;color:#2a1d10}
#info{position:fixed;right:6px;top:58px;z-index:5;background:#2a1d10dd;border:1px solid #c9a24b;border-radius:8px;padding:6px 8px;font-size:12px;max-width:46vw;display:none}
#modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center}
#modal .box{background:#2a1d10;border:2px solid #c9a24b;border-radius:12px;padding:16px;max-width:92vw;width:440px;max-height:85vh;overflow:auto;font-size:14px;line-height:1.7}
#modal button{background:#c9a24b;color:#2a1d10;border:0;border-radius:8px;padding:8px 14px;font-family:inherit;font-weight:bold;margin:4px 2px}
.bar{height:8px;background:#1b1410;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#7bc96f}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="خريطة حضارة النيل"></canvas>
<div id="top"></div>
<div id="spd" role="group" aria-label="سرعة اللعبة"><button data-s="0" aria-label="إيقاف مؤقت">⏸</button><button data-s="1" class="on" aria-label="سرعة عادية">▶</button><button data-s="3" aria-label="سرعة مضاعفة">⏩</button><button data-s="8" aria-label="أقصى سرعة">⏭</button></div>
<div id="info"></div><canvas id="mm" role="img" aria-label="خريطة مصغرة، اضغط للانتقال" width="88" height="88" style="position:fixed;left:6px;bottom:calc(var(--bh,80px) + 8px);z-index:4;border:2px solid #c9a24b;border-radius:6px;opacity:.9"></canvas>
<div id="toast" role="status" aria-live="polite"></div><div id="sv" style="position:fixed;left:50%;transform:translateX(-50%);top:2px;z-index:8;font-size:10px;opacity:0;transition:opacity .4s;background:#000a;padding:1px 8px;border-radius:8px">💾 حُفظ تلقائياً</div>
<div id="bar"><div id="tabs"></div><div id="panel"></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script src="game.js"></script><script src="feat.js"></script>
</body>
 </html>
